<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mac Desktop">
  <meta name="description" content="A macOS-inspired desktop environment for iPhone.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Mac Desktop</title>
</head>
<body>
  <div id="boot" class="boot"><div class="boot-logo"></div><div class="boot-title">Mac Desktop</div><div class="boot-bar"><i></i></div></div>
  <main id="desktop" class="desktop hidden">
    <div class="wallpaper"></div>
    <header class="menubar">
      <div class="menu-left"><span class="apple">●</span><strong id="active-app">Finder</strong><button class="menu-item" id="file-menu">檔案</button><button class="menu-item" id="view-menu">顯示方式</button></div>
      <div class="menu-right"><span class="status-dot"></span><span id="clock">--:--</span></div>
    </header>
    <section id="desktop-icons" class="desktop-icons" aria-label="桌面圖示"></section>
    <section id="windows" class="windows"></section>
    <nav class="dock-wrap"><div class="dock" id="dock">
      <button class="dock-icon finder" data-app="finder" aria-label="Finder">▣<small>Finder</small></button>
      <button class="dock-icon notes" data-app="notes" aria-label="Notes">▤<small>Notes</small></button>
      <button class="dock-icon terminal" data-app="terminal" aria-label="Terminal">⌘<small>Terminal</small></button>
      <button class="dock-icon browser" data-app="browser" aria-label="Browser">◎<small>Browser</small></button>
      <button class="dock-icon calc" data-app="calculator" aria-label="Calculator">＋<small>Calculator</small></button>
      <button class="dock-icon settings" data-app="settings" aria-label="Settings">⚙<small>Settings</small></button>
    </div></nav>
    <div id="toast" class="toast" role="status"></div>
  </main>
  <input type="file" id="import-file" hidden>
  <script src="./app.js"></script>
</body>
</html>
